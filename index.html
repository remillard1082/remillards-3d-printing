<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remillard's 3D Printing</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #2a0000 0%, #0d0d0d 38%, #050505 100%);
      color: white;
      min-height: 100vh;
    }

    .page {
      max-width: 750px;
      margin: auto;
      padding: 28px 18px 50px;
    }

    .hero {
      text-align: center;
      padding: 30px 20px;
      border: 1px solid #3c3c3c;
      border-radius: 28px;
      background: rgba(18,18,18,.92);
      box-shadow:
        0 0 35px rgba(255,0,0,.15),
        inset 0 0 30px rgba(255,255,255,.02);
    }

    .logo {
      width: 135px;
      height: 135px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #161616, #050505);
      border: 4px solid #d71920;
      box-shadow:
        0 0 12px #d71920,
        0 0 32px rgba(215,25,32,.55);
      font-size: 49px;
      font-weight: 900;
      letter-spacing: -8px;
      padding-right: 8px;
    }

    .logo .r {
      color: white;
    }

    .logo .three {
      color: #d71920;
    }

    h1 {
      font-size: clamp(31px, 8vw, 52px);
      line-height: 1.05;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 1px;
    }

    h1 span {
      color: #e21d25;
      text-shadow: 0 0 16px rgba(226,29,37,.5);
    }

    .tagline {
      margin-top: 13px;
      color: #cfcfcf;
      font-size: 17px;
      line-height: 1.5;
    }

    .owner {
      margin-top: 15px;
      font-weight: 700;
      color: #ffffff;
    }

    .buttons {
      display: grid;
      gap: 12px;
      margin-top: 26px;
    }

    .button {
      text-decoration: none;
      color: white;
      padding: 16px 18px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 800;
      background: linear-gradient(135deg, #d71920, #8c0b10);
      border: 1px solid #ef4147;
      box-shadow: 0 7px 20px rgba(215,25,32,.23);
      transition: .2s;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .button.secondary {
      background: #171717;
      border-color: #454545;
      box-shadow: none;
    }

    .section {
      margin-top: 22px;
      background: rgba(18,18,18,.94);
      border: 1px solid #343434;
      border-radius: 22px;
      padding: 24px;
    }

    .section h2 {
      font-size: 25px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .section h2 span {
      color: #e21d25;
    }

    .services {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .service {
      background: #0b0b0b;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 18px 10px;
      text-align: center;
      font-weight: 700;
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
