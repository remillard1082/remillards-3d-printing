<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review Admin | Remillard's 3D Printing</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:760px;margin:auto;padding:22px}
.card{background:#121212;border:1px solid #333;border-radius:22px;padding:22px;margin:18px 0}
h1{margin:0 0 8px;font-size:32px} h2{margin-top:0}
.muted{color:#aaa;line-height:1.45}
input,button{width:100%;font-size:18px;border-radius:14px;padding:15px;margin:8px 0}
input{background:#080808;color:#fff;border:1px solid #555}
button{border:0;font-weight:800;cursor:pointer}
.primary{background:#e31b23;color:#fff}
.approve{background:#17883e;color:#fff}
.delete{background:#b71c1c;color:#fff}
.secondary{background:#333;color:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.review{border-top:1px solid #333;padding-top:18px;margin-top:18px}
.stars{font-size:22px}
.review img{width:100%;max-height:420px;object-fit:contain;border-radius:14px;background:#000;margin:12px 0}
.status{padding:12px;border-radius:12px;margin-top:10px;display:none}
.ok{display:block;background:#123b20;border:1px solid #238647}
.err{display:block;background:#431313;border:1px solid #a33}
.topbar{display:flex;gap:10px;align-items:center;justify-content:space-between}
.topbar button{width:auto;padding:10px 14px}
@media(max-width:520px){.row{grid-template-columns:1fr} h1{font-size:27px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Review Admin</h1>
    <p class="muted">Private approval page for Remillard's 3D Printing.</p>
    <div id="loginBox">
      <input id="email" type="email" autocomplete="username" placeholder="Admin email">
      <input id="password" type="password" autocomplete="current-password" placeholder="Password">
      <button class="primary" onclick="signIn()">Sign In</button>
    </div>
    <div id="adminBox" hidden>
      <div class="topbar">
        <strong id="signedInAs"></strong>
        <button class="secondary" onclick="signOut()">Sign Out</button>
      </div>
      <div id="reviews"></div>
    </div>
    <div id="status" class="status"></div>
  </div>
</div>
<script>
const SUPABASE_URL = 'https://dqxilrvvlzfelhbilacy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_x4luFP2eIt0egjEREup7VQ_TFuSXOBB';
const TABLE = 'Reviews';
let accessToken = sessionStorage.getItem('review_admin_access_token') || '';
let refreshToken = sessionStorage.getItem('review_admin_refresh_token') || '';

function msg(text, ok=false) {
  const el=document.getElementById('status');
  el.textContent=text; el.className='status '+(ok?'ok':'err');
}
function clearMsg() { document.getElementById('status').className='status'; }

async function signIn() {
  clearMsg();
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  if(!email || !password) return msg('Enter your email and password.');
  try {
    const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password', {
      method:'POST',
      headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email,password})
    });
    const d=await r.json();
    if(!r.ok) throw new Error(d.error_description || d.msg || d.message || 'Sign in failed.');
    accessToken=d.access_token; refreshToken=d.refresh_token || '';
    sessionStorage.setItem('review_admin_access_token',accessToken);
    sessionStorage.setItem('review_admin_refresh_token',refreshToken);
    document.getElementById('signedInAs').textContent=email;
    showAdmin();
    await loadReviews();
  } catch(e) { msg(e.message); }
}

async function refreshSession() {
  if(!refreshToken) return false;
  const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token', {
    method:'POST',
    headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({refresh_token:refreshToken})
  });
  if(!r.ok) return false;
  const d=await r.json();
  accessToken=d.access_token; refreshToken=d.refresh_token || refreshToken;
  sessionStorage.setItem('review_admin_access_token',accessToken);
  sessionStorage.setItem('review_admin_refresh_token',refreshToken);
  return true;
}

async function api(path, options={}, retry=true) {
  options.headers=Object.assign({'apikey':SUPABASE_KEY,'Authorization':'Bearer '+accessToken}, options.headers||{});
  let r=await fetch(SUPABASE_URL+path, options);
  if(r.status===401 && retry && await refreshSession()) return api(path,options,false);
  return r;
}

function showAdmin() {
  document.getElementById('loginBox').hidden=true;
  document.getElementById('adminBox').hidden=false;
}
function signOut() {
  sessionStorage.removeItem('review_admin_access_token');
  sessionStorage.removeItem('review_admin_refresh_token');
  accessToken=''; refreshToken='';
  document.getElementById('adminBox').hidden=true;
  document.getElementById('loginBox').hidden=false;
  document.getElementById('password').value='';
  clearMsg();
}

function esc(v) {
  return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function reviewCard(x, published=false) {
  return `
    <div class="review" id="review-${x.id}">
      <strong>${esc(x.customer_name)}</strong>
      <div class="stars">${'★'.repeat(Number(x.rating)||0)}${'☆'.repeat(Math.max(0,5-(Number(x.rating)||0)))}</div>
      <p>${esc(x.review_text)}</p>
      ${x.photo_url ? `<img src="${esc(x.photo_url)}" alt="Customer review photo">` : ''}
      <div class="row">
        ${published ? '' : `<button class="approve" onclick="approveReview(${x.id})">Approve</button>`}
        <button class="delete" onclick="deleteReview(${x.id}, ${published ? 'true' : 'false'})">Delete</button>
      </div>
    </div>`;
}

async function loadReviews() {
  clearMsg();

  const pendingResp = await api('/rest/v1/'+TABLE+'?select=id,created_at,customer_name,rating,review_text,approved,photo_url&approved=eq.false&order=created_at.desc');
  if(!pendingResp.ok) {
    const t=await pendingResp.text();
    return msg('Could not load pending reviews. '+t);
  }

  const publishedResp = await api('/rest/v1/'+TABLE+'?select=id,created_at,customer_name,rating,review_text,approved,photo_url&approved=eq.true&order=created_at.desc');
  if(!publishedResp.ok) {
    const t=await publishedResp.text();
    return msg('Could not load published reviews. '+t);
  }

  const pending = await pendingResp.json();
  const published = await publishedResp.json();
  const box=document.getElementById('reviews');

  let output = '<h2>Pending Reviews ('+pending.length+')</h2>';
  if(!pending.length) {
    output += '<div class="review"><p class="muted">No pending reviews.</p></div>';
  } else {
    output += pending.map(x=>reviewCard(x,false)).join('');
  }

  output += '<h2 style="margin-top:34px;">Published Reviews ('+published.length+')</h2>';
  if(!published.length) {
    output += '<div class="review"><p class="muted">No published reviews yet.</p></div>';
  } else {
    output += published.map(x=>reviewCard(x,true)).join('');
  }

  box.innerHTML = output;
}

async function approveReview(id) {
  if(!confirm('Approve this review and publish it on the website?')) return;
  const r=await api('/rest/v1/'+TABLE+'?id=eq.'+encodeURIComponent(id), {
    method:'PATCH',
    headers:{'Content-Type':'application/json','Prefer':'return=minimal'},
    body:JSON.stringify({approved:true})
  });
  if(!r.ok) return msg('Could not approve review. '+await r.text());
  msg('Review approved.',true); await loadReviews();
}

async function deleteReview(id, published=false) {
  const text = published
    ? 'Permanently delete this published review? It will disappear from the website immediately.'
    : 'Permanently delete this pending review?';
  if(!confirm(text)) return;

  const r=await api('/rest/v1/'+TABLE+'?id=eq.'+encodeURIComponent(id), {
    method:'DELETE',
    headers:{'Prefer':'return=minimal'}
  });

  if(!r.ok) return msg('Could not delete review. '+await r.text());
  msg(published ? 'Published review deleted.' : 'Pending review deleted.',true);
  await loadReviews();
}

(async()=>{
  if(accessToken) {
    showAdmin();
    const r=await api('/auth/v1/user');
    if(r.ok) {
      const u=await r.json();
      document.getElementById('signedInAs').textContent=u.email || 'Admin';
      await loadReviews();
    } else signOut();
  }
})();
</script>
</body>
</html>
